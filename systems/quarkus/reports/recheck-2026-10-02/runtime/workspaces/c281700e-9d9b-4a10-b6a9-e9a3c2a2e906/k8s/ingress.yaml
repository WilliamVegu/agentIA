apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audit-library-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx
  rules:
    - host: audit-library.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audit-library-service
                port:
                  number: 80
