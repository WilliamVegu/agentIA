# ==============================================================================
# GitLab CI Pipeline for audit-library
# ==============================================================================

stages:
  - build-test
  - security-audit
  - container-scan

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/audit-library:$CI_COMMIT_SHA"

cache:
  paths:
    - .m2/repository/

# Stage 1: Hermetic Maven Compilation & Unit/Integration Tests
maven-test:
  stage: build-test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn clean test -B
  artifacts:
    paths:
      - target/

# Stage 2: SAST & Secret Leak Audit
security-gate:
  stage: security-audit
  image: alpine:latest
  script:
    - echo "Validating Constitution Principles & Quality Gate..."

# Stage 3: Docker Build & Trivy Scan
docker-trivy:
  stage: container-scan
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker build -t audit-library:latest .
    - trivy image --exit-code 1 --severity CRITICAL audit-library:latest
