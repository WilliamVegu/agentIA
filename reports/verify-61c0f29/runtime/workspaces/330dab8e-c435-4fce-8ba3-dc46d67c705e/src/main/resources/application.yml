spring:
  application:
    name: audit-library
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:auditlibrary;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
server:
  port: 8080
